---
- name: Apply common baseline configuration
  hosts: all
  vars_files:
    - ../vault/secrets.yml
  roles:
    - common
    - newrelic

- name: Configure Web Servers
  hosts: web
  roles:
    - nginx

- name: Configure Application Servers
  hosts: app
  roles:
    - docker

- name: Configure Database Servers
  hosts: database
  become: yes
  vars_files:
    - ../vault/secrets.yml
  roles:
    - common
    - database