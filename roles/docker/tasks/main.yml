---
- name: Install Docker and required dependencies
  ansible.builtin.apt:
    name: 
      - docker.io
      - python3-docker
    state: present
  become: yes

- name: Ensure Docker service is started and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes
  become: yes

- name: Add ubuntu user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: yes
  become: yes

- name: Deploy simple web application container
  community.docker.docker_container:
    name: simple-webapp
    image: nginxdemos/hello
    state: started
    restart_policy: always
    ports:
      - "80:80"
  become: yes